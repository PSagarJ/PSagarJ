name: Update README Quote

# Runs every 6 hours automatically, and can also be triggered manually
# from the Actions tab whenever you want an instant refresh.
on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:

# Only grants write access to THIS repo's contents. Nothing else.
permissions:
  contents: write

jobs:
  update-quote:
    runs-on: ubuntu-latest
    steps:
      # Official action maintained by GitHub itself (not third-party).
      # Needed just to pull the repo files onto the runner.
      - name: Checkout repo
        uses: actions/checkout@v4

      # Plain Python, using only the standard library (urllib, json, re).
      # No external packages installed, nothing beyond a read-only
      # HTTP GET to a public quote API.
      - name: Fetch a new quote and update README
        run: |
          python3 << 'PYEOF'
          import urllib.request
          import json
          import re

          with urllib.request.urlopen("https://zenquotes.io/api/random", timeout=10) as response:
              data = json.loads(response.read().decode())

          quote = data[0]["q"]
          author = data[0]["a"]
          new_line = f'<i>"{quote}" — {author}</i>'

          with open("README.md", "r", encoding="utf-8") as f:
              content = f.read()

          pattern = re.compile(
              r"(<!--QUOTE_START-->\n).*?(\n<!--QUOTE_END-->)",
              re.DOTALL
          )
          content = pattern.sub(lambda m: m.group(1) + new_line + m.group(2), content)

          with open("README.md", "w", encoding="utf-8") as f:
              f.write(content)
          PYEOF

      # Commits only if something actually changed, using the
      # short-lived, repo-scoped GITHUB_TOKEN GitHub provides automatically.
      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh README quote"
            git push
          else
            echo "No change in quote, skipping commit."
          fi
